<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="invault-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="invault-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect x="25" y="25" width="450" height="450" rx="100" fill="#0F172A" filter="url(#shadow)"/>
  <rect x="25" y="25" width="450" height="450" rx="100" fill="none" stroke="url(#invault-grad)" stroke-width="6" opacity="0.3"/>

  <!-- Shield & Vault Outer Frame -->
  <path d="M 250,90 
           L 370,140 
           V 270 
           C 370,350 250,410 250,410 
           C 250,410 130,350 130,270 
           V 140 
           Z" 
        fill="none" 
        stroke="url(#invault-grad)" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Invoice Sheet & Lines inside Vault -->
  <rect x="190" y="165" width="120" height="150" rx="12" fill="none" stroke="url(#invault-glow)" stroke-width="16" stroke-linecap="round"/>
  <line x1="220" y1="205" x2="280" y2="205" stroke="url(#invault-grad)" stroke-width="14" stroke-linecap="round"/>
  <line x1="220" y1="240" x2="280" y2="240" stroke="url(#invault-grad)" stroke-width="14" stroke-linecap="round"/>
  <line x1="220" y1="275" x2="255" y2="275" stroke="url(#invault-grad)" stroke-width="14" stroke-linecap="round"/>

  <!-- Keyhole / Lock Core -->
  <circle cx="250" cy="335" r="16" fill="#00E5FF"/>
  <polygon points="244,335 256,335 259,365 241,365" fill="#00E5FF"/>
</svg>